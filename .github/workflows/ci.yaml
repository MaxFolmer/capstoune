name: CI and release
on:
  push:
    branches: ["**"]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          INTEGRATION: '1'
  publish:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release and compute image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=latest
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$tag" = "v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            grep -F "## [$tag]" CHANGELOG.md
          fi
          echo "image=$image" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.image }}:${{ env.tag }},${{ env.image }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ env.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  verify-rollback:
    needs: publish
    if: github.ref == 'refs/tags/v1.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure isolated test deployment
        shell: bash
        run: |
          python3 scripts/init-env.py
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> .env
          echo 'PORT=18080' >> .env
      - name: Deploy, upgrade and roll back published images
        env:
          BASE_URL: http://localhost:18080
        run: bash scripts/demo-rollback.sh v1.0.0 v1.1.0
      - name: Collect logs
        if: always()
        env:
          IMAGE_TAG: v1.1.0
        run: |
          mkdir -p evidence
          docker compose -p guestbook-prod -f compose.prod.yaml logs --no-color > evidence/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-evidence
          path: evidence/
      - name: Remove isolated test deployment
        if: always()
        env:
          IMAGE_TAG: v1.1.0
        run: docker compose -p guestbook-prod -f compose.prod.yaml down -v
