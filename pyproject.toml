[project]
name = "guestbook"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "psycopg[binary]>=3.2", "pydantic-settings>=2.6", "uvicorn[standard]>=0.32"]
[dependency-groups]
dev = ["ruff>=0.9", "pytest>=8", "httpx>=0.28"]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
